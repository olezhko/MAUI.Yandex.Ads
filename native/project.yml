# XcodeGen spec for the wrapper framework.
# Generate the project with:  xcodegen generate   (brew install xcodegen)
name: YandexAdsBridge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode keeps Swift 6 strict-concurrency issues as warnings
    # (the SDK itself is built with Swift 6 and uses MainActor isolation).
    SWIFT_VERSION: "5.0"
    # CocoaPods' [CP] script phases do not work with user script sandboxing.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  YandexAdsBridge:
    type: framework            # dynamic framework: all static pods get linked INTO it
    platform: iOS
    sources:
      - path: YandexAdsBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.YandexAdsBridge
        PRODUCT_NAME: YandexAdsBridge
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: YES   # produces YandexAdsBridge-Swift.h for binding
        SKIP_INSTALL: NO                 # required so the framework lands in the archive
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        CODE_SIGNING_ALLOWED: NO         # the .NET app build re-signs embedded frameworks
    scheme: {}
