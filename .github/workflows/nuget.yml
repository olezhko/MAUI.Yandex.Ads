name: NuGet

on:
  push:
    branches: [master]
    tags: ['v*']          # push a tag like v1.2.3 to publish 1.2.3 to nuget.org
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    # iOS target needs macOS + Xcode; Android builds here too, so one job packs both TFMs.
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write     # OIDC token for nuget.org Trusted Publishing
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PROJECT: MAUI.Yandex.Ads/MAUI.Yandex.Ads.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        run: >
          dotnet pack "$PROJECT" -c Release -o nupkgs
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:ContinuousIntegrationBuild=true
          $VERSION_ARG

      - name: Check package contents
        run: |
          unzip -l nupkgs/*.nupkg | grep -E 'lib/'
          unzip -l nupkgs/*.nupkg | grep -q 'MAUI.Yandex.Ads.iOS.Binding.resources.zip' \
            || { echo "::error::iOS native resources missing from package"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      # Needs a matching policy on nuget.org and the nuget.org user name in the NUGET_USER secret.
      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
